<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Dashboard - Clinical Trials Portal</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">Clinical Trials Portal</a>

    <div class="navbar-nav ms-auto">
      <a class="nav-link active" href="/dashboard">Dashboard</a>
      <a class="nav-link" href="/logout">Logout</a>
    </div>
  </div>
</nav>

<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">

          <h1 class="h3 card-title">
            Dashboard
          </h1>

          <div class="alert alert-success" role="alert">
            Welcome, <strong>{{ user }}</strong>.
          </div>

          <p class="text-muted">
            Your session expires after {{ idle_timeout }} seconds of inactivity.
          </p>

          <a class="btn btn-primary" href="/trials">
            Open Trial Registry
          </a>

          <a class="btn btn-outline-secondary ms-2" href="/">
            Home
          </a>

          <a class="btn btn-danger ms-2" href="/logout">
            Logout
          </a>

        </div>
      </div>

    </div>
  </div>
</main>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
